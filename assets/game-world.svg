<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CodeByAbi developer game world</title>
  <desc id="desc">An animated pixel game scene where Abi runs across a circuit board toward a glowing laptop while bugs and a robot move around him.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#090b13"/><stop offset="1" stop-color="#11162a"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16223c"/><stop offset="1" stop-color="#101629"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="pixelGlow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="stars" width="80" height="60" patternUnits="userSpaceOnUse"><rect x="12" y="11" width="2" height="2" fill="#7df9c2" opacity=".35"/><rect x="58" y="39" width="2" height="2" fill="#b98cff" opacity=".3"/></pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.label{font-size:14px;letter-spacing:3px}.small{font-size:12px;letter-spacing:2px}.pixel{shape-rendering:crispEdges}.scan{animation:scan 4s linear infinite}.cursor{animation:blink 1s steps(1) infinite}.laptop{animation:laptop 2.8s ease-in-out infinite}.drone{animation:float 2.4s ease-in-out infinite}.runner{animation:run 7s linear infinite}.bug1{animation:enemy 6s linear infinite}.bug2{animation:enemy2 8s linear infinite}.spark1{animation:spark 2.4s linear infinite}.spark2{animation:spark 2.4s .8s linear infinite}.spark3{animation:spark 2.4s 1.6s linear infinite}.bar{animation:charge 4s ease-in-out infinite}.eye{animation:blink 3s steps(1) infinite}.wheel{animation:wheel .45s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes scan{to{transform:translateY(170px)}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes laptop{0%,100%{transform:translate(620px,143px)}50%{transform:translate(620px,138px)}}@keyframes float{0%,100%{transform:translate(990px,172px)}50%{transform:translate(990px,160px)}}@keyframes run{0%{transform:translate(40px,345px)}45%{transform:translate(410px,345px)}55%{transform:translate(410px,345px)}100%{transform:translate(1000px,345px)}}@keyframes enemy{0%,100%{transform:translate(1040px,367px)}50%{transform:translate(880px,367px)}}@keyframes enemy2{0%,100%{transform:translate(350px,377px)}50%{transform:translate(470px,377px)}}@keyframes spark{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(80px,-50px)}}@keyframes charge{0%,12%{width:12px}55%,100%{width:250px}}@keyframes wheel{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.laptop{transform:translate(620px,143px)}.drone{transform:translate(990px,172px)}.runner{transform:translate(150px,345px)}.bug1{transform:translate(1040px,367px)}.bug2{transform:translate(350px,377px)}*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="520" rx="18" fill="url(#sky)"/>
  <rect width="1200" height="520" rx="18" fill="url(#stars)"/>
  <path d="M0 104H1200M0 105H1200" stroke="#283149" stroke-opacity=".8"/>
  <path d="M28 26h1144v58H28z" fill="#0d111f" stroke="#35405c"/>
  <path d="M45 43h13v13H45zM45 61h13v8H45z" fill="#7df9c2" class="pixel"/>
  <text x="72" y="54" fill="#7df9c2" class="mono small">PLAYER</text><text x="72" y="72" fill="#f4f7ff" class="mono" font-size="17" font-weight="700">ABI</text>
  <text x="255" y="52" fill="#8491a8" class="mono small">CLASS</text><text x="255" y="72" fill="#f4f7ff" class="mono" font-size="17" font-weight="700">FULL-STACK BUILDER</text>
  <text x="675" y="52" fill="#8491a8" class="mono small">CURRENT QUEST</text><text x="675" y="72" fill="#f4f7ff" class="mono" font-size="17" font-weight="700">TURN IDEAS INTO SHIPPED SOFTWARE</text>
  <rect x="1045" y="43" width="100" height="12" fill="#242c40"/><rect x="1045" y="43" width="84" height="12" fill="#7df9c2"/><text x="1045" y="73" fill="#8491a8" class="mono small">XP 84%</text>

  <g transform="translate(70 125)"><text fill="#b98cff" class="mono label">CODEBYABI</text><text y="58" fill="#f4f7ff" class="mono" font-size="42" font-weight="800">BUILD. DEBUG. LEVEL UP.</text><text y="87" fill="#aab6ca" class="mono" font-size="15">WEB · MOBILE · APIS · AUTOMATION</text><rect y="110" width="275" height="5" fill="#242c40"/><rect y="110" width="12" height="5" fill="#b98cff" class="bar"/><text y="139" fill="#7df9c2" class="mono small">SYSTEM READY <tspan class="cursor">█</tspan></text></g>

  <ellipse cx="736" cy="315" rx="235" ry="70" fill="#7b61ff" opacity=".08" filter="url(#soft)"/>
  <g class="laptop">
    <path d="M45 0h236c10 0 18 8 18 18v162H27V18C27 8 35 0 45 0z" fill="#20283b" stroke="#67728a" stroke-width="3"/>
    <rect x="45" y="18" width="236" height="145" rx="3" fill="url(#screen)"/>
    <rect x="55" y="30" width="216" height="4" fill="#25314c"/><circle cx="61" cy="31.8" r="2" fill="#ff6b73"/><circle cx="69" cy="31.8" r="2" fill="#ffd166"/><circle cx="77" cy="31.8" r="2" fill="#7df9c2"/>
    <g transform="translate(66 50)" class="pixel"><rect width="56" height="8" fill="#b98cff"/><rect y="20" width="125" height="6" fill="#35405a"/><rect y="35" width="87" height="6" fill="#35405a"/><rect y="50" width="148" height="6" fill="#35405a"/><rect y="73" width="92" height="8" fill="#7df9c2"/><rect x="104" y="73" width="49" height="8" fill="#2f3a52"/></g>
    <rect x="45" y="18" width="236" height="2" fill="#7df9c2" opacity=".7" class="scan"/>
    <path d="M12 180h302l24 27c4 5 1 11-6 11H-6c-7 0-10-6-6-11z" fill="#2a3348" stroke="#67728a" stroke-width="3"/><rect x="130" y="191" width="66" height="10" rx="3" fill="#151b2a"/>
  </g>

  <g class="drone" transform="translate(990 172)"><path d="M0 25h16M72 25h16" stroke="#7df9c2" stroke-width="4"/><rect x="16" y="8" width="56" height="40" rx="6" fill="#263149" stroke="#7df9c2" stroke-width="2"/><rect x="27" y="20" width="10" height="10" fill="#7df9c2" class="eye"/><rect x="51" y="20" width="10" height="10" fill="#7df9c2" class="eye"/><path d="M31 39h26" stroke="#aab6ca" stroke-width="2"/><circle cx="7" cy="25" r="7" fill="none" stroke="#b98cff" stroke-width="2" class="wheel"/><circle cx="81" cy="25" r="7" fill="none" stroke="#b98cff" stroke-width="2" class="wheel"/></g>

  <path d="M0 405h1200v115H0z" fill="#0b0f1b"/><path d="M0 405h1200" stroke="#7df9c2" stroke-width="4"/><path d="M0 440h105l18-18h135l24 24h154l20-16h104l28 22h170l24-24h170l18 18h250" fill="none" stroke="#29344c" stroke-width="3"/><path d="M45 485h150M220 472h90M815 484h180M1030 468h120" stroke="#b98cff" stroke-width="3" opacity=".55"/>
  <g class="runner pixel" transform="translate(150 345)"><rect x="16" width="32" height="26" fill="#f2b98b"/><rect x="12" y="5" width="8" height="15" fill="#171b28"/><rect x="44" y="5" width="8" height="15" fill="#171b28"/><rect x="23" y="10" width="5" height="5" fill="#10131d"/><rect x="37" y="10" width="5" height="5" fill="#10131d"/><rect x="15" y="26" width="36" height="32" fill="#7b61ff"/><rect x="4" y="31" width="11" height="22" fill="#f2b98b"/><rect x="51" y="31" width="11" height="22" fill="#f2b98b"/><rect x="18" y="58" width="13" height="24" fill="#222a3d"/><rect x="36" y="58" width="13" height="24" fill="#222a3d"/><rect x="12" y="80" width="20" height="8" fill="#7df9c2"/><rect x="36" y="80" width="20" height="8" fill="#7df9c2"/></g>
  <g class="bug1 pixel" transform="translate(1040 367)"><rect x="12" width="28" height="22" fill="#ff5f6d"/><rect x="5" y="7" width="8" height="8" fill="#ff5f6d"/><rect x="39" y="7" width="8" height="8" fill="#ff5f6d"/><rect x="18" y="6" width="5" height="5" fill="#fff"/><rect x="29" y="6" width="5" height="5" fill="#fff"/><path d="M7 24l-7 8m17-8l-4 10m32-10l7 8M35 24l4 10" stroke="#ff5f6d" stroke-width="4"/></g>
  <g class="bug2 pixel" transform="translate(350 377)"><rect x="8" width="22" height="17" fill="#ffd166"/><rect x="13" y="4" width="4" height="4" fill="#111"/><rect x="22" y="4" width="4" height="4" fill="#111"/><path d="M8 18l-8 7m13-7l-3 9m20-9l8 7m-13-7l3 9" stroke="#ffd166" stroke-width="3"/></g>
  <g fill="#7df9c2" filter="url(#pixelGlow)"><rect class="spark1" x="470" y="360" width="5" height="5"/><rect class="spark2" x="470" y="360" width="4" height="4"/><rect class="spark3" x="470" y="360" width="3" height="3"/></g>
</svg>
