<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Abi's developer loadout</title>
  <desc id="desc">A game inventory inspired panel showing Abi's frontend, backend, data, and tool skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="390" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="388" rx="27" fill="none" stroke="#30363d" stroke-width="2"/>
  <path d="M44 91H1156" stroke="#21262d" stroke-width="2"/><circle cx="50" cy="44" r="7" fill="#ff6b6b"/><circle cx="75" cy="44" r="7" fill="#ffd166"/><circle cx="100" cy="44" r="7" fill="#57cc99"/>
  <text x="600" y="56" text-anchor="middle" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700" letter-spacing="7">PLAYER LOADOUT</text>
  <rect x="460" y="75" width="280" height="3" rx="2" fill="url(#shine)" filter="url(#glow)"/>
  <g transform="translate(35 120)">
    <rect width="265" height="225" rx="20" fill="#161b22" stroke="#8b5cf6" stroke-opacity=".55"/><rect x="24" y="24" width="56" height="42" rx="5" fill="none" stroke="#a78bfa" stroke-width="4"/><path d="M17 74h70" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    <text x="100" y="49" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">FRONTEND</text>
    <text x="24" y="116" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">React</text><text x="24" y="151" fill="#8b949e" font-family="system-ui, sans-serif" font-size="20">TypeScript</text><text x="24" y="184" fill="#8b949e" font-family="system-ui, sans-serif" font-size="20">Next.js</text>
    <rect x="24" y="202" width="150" height="5" rx="3" fill="#8b5cf6"/><rect x="174" y="202" width="56" height="5" rx="3" fill="#30363d"/>
  </g>
  <g transform="translate(323 120)">
    <rect width="265" height="225" rx="20" fill="#161b22" stroke="#22d3ee" stroke-opacity=".55"/><rect x="24" y="24" width="59" height="17" rx="4" fill="none" stroke="#22d3ee" stroke-width="3"/><rect x="24" y="49" width="59" height="17" rx="4" fill="none" stroke="#22d3ee" stroke-width="3"/><circle cx="72" cy="32.5" r="3" fill="#22d3ee"/><circle cx="72" cy="57.5" r="3" fill="#22d3ee"/>
    <text x="102" y="49" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">BACKEND</text>
    <text x="24" y="116" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Node.js</text><text x="24" y="151" fill="#8b949e" font-family="system-ui, sans-serif" font-size="20">Express</text><text x="24" y="184" fill="#8b949e" font-family="system-ui, sans-serif" font-size="20">REST APIs</text>
    <rect x="24" y="202" width="166" height="5" rx="3" fill="#22d3ee"/><rect x="190" y="202" width="40" height="5" rx="3" fill="#30363d"/>
  </g>
  <g transform="translate(611 120)">
    <rect width="265" height="225" rx="20" fill="#161b22" stroke="#f59e0b" stroke-opacity=".55"/><ellipse cx="52" cy="29" rx="29" ry="10" fill="none" stroke="#fbbf24" stroke-width="3"/><path d="M23 29v34c0 6 13 10 29 10s29-4 29-10V29M23 46c0 6 13 10 29 10s29-4 29-10" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <text x="102" y="49" fill="#fcd34d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">DATA</text>
    <text x="24" y="116" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">MongoDB</text><text x="24" y="151" fill="#8b949e" font-family="system-ui, sans-serif" font-size="20">PostgreSQL</text><text x="24" y="184" fill="#8b949e" font-family="system-ui, sans-serif" font-size="20">Data models</text>
    <rect x="24" y="202" width="142" height="5" rx="3" fill="#f59e0b"/><rect x="166" y="202" width="64" height="5" rx="3" fill="#30363d"/>
  </g>
  <g transform="translate(899 120)">
    <rect width="265" height="225" rx="20" fill="#161b22" stroke="#34d399" stroke-opacity=".55"/><path d="M29 61l24-24 14 14-24 24H29zM57 33l8-8 14 14-8 8" fill="none" stroke="#34d399" stroke-width="3" stroke-linejoin="round"/>
    <text x="102" y="49" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">GEAR</text>
    <text x="24" y="116" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Git + GitHub</text><text x="24" y="151" fill="#8b949e" font-family="system-ui, sans-serif" font-size="20">Linux</text><text x="24" y="184" fill="#8b949e" font-family="system-ui, sans-serif" font-size="20">Postman</text>
    <rect x="24" y="202" width="178" height="5" rx="3" fill="#34d399"/><rect x="202" y="202" width="28" height="5" rx="3" fill="#30363d"/>
