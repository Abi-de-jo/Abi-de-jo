<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Mission select</title><desc id="desc">Four real CodeByAbi projects shown as game missions: Penny, Phone Guard, OpenCode and Athena AI.</desc>
  <defs><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.cap{font-size:12px;letter-spacing:2px}.scan{animation:scan 6s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes scan{0%{transform:translateX(-300px)}100%{transform:translateX(1200px)}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="line" x1="0" x2="1"><stop stop-color="#7df9c2"/><stop offset=".5" stop-color="#b98cff"/><stop offset="1" stop-color="#ffd166"/></linearGradient></defs>
  <rect width="1200" height="440" rx="18" fill="#0b0f1a"/><rect x="1" y="1" width="1198" height="438" rx="17" fill="none" stroke="#303950"/>
  <text x="45" y="53" fill="#f4f7ff" class="m" font-size="25" font-weight="700">MISSION SELECT</text><text x="45" y="78" fill="#7df9c2" class="m cap">REAL BUILDS · CHOOSE A FILE BELOW</text>
  <rect x="45" y="103" width="1110" height="2" fill="#252e43"/><rect x="45" y="103" width="240" height="2" fill="url(#line)" class="scan"/>
  <g transform="translate(45 135)"><path d="M0 0h530v112l-20 20H0z" fill="#131a2a" stroke="#37425d"/><rect x="22" y="21" width="62" height="62" fill="#19223a" stroke="#7df9c2"/><circle cx="53" cy="52" r="18" fill="none" stroke="#7df9c2" stroke-width="3"/><path d="M48 43h8a6 6 0 0 1 0 12h-8v8m0-12h8" fill="none" stroke="#7df9c2" stroke-width="3" stroke-linecap="round"/><text x="105" y="39" fill="#7df9c2" class="m cap">ANDROID · KOTLIN</text><text x="105" y="67" fill="#f4f7ff" class="m" font-size="23" font-weight="700">PENNY</text><text x="105" y="95" fill="#aab6ca" class="m" font-size="14">Local-first offline money tracker</text><text x="488" y="37" text-anchor="end" fill="#7df9c2" class="m cap pulse">OFFLINE</text></g>
  <g transform="translate(625 135)"><path d="M0 0h530v112l-20 20H0z" fill="#131a2a" stroke="#37425d"/><rect x="22" y="21" width="62" height="62" fill="#19223a" stroke="#ffd166"/><path d="M53 33l15 6v13c0 10-7 16-15 19-8-3-15-9-15-19V39z" fill="none" stroke="#ffd166" stroke-width="3"/><circle cx="53" cy="51" r="3" fill="#ffd166"/><text x="105" y="39" fill="#ffd166" class="m cap">SECURITY · REACT NATIVE</text><text x="105" y="67" fill="#f4f7ff" class="m" font-size="23" font-weight="700">PHONE GUARD</text><text x="105" y="95" fill="#aab6ca" class="m" font-size="14">Anti-theft motion &amp; sensor alarm</text><text x="488" y="37" text-anchor="end" fill="#ffd166" class="m cap">ARMED</text></g>
  <g transform="translate(45 295)"><path d="M0 0h530v112l-20 20H0z" fill="#131a2a" stroke="#37425d"/><rect x="22" y="21" width="62" height="62" fill="#19223a" stroke="#b98cff"/><rect x="33" y="35" width="40" height="34" rx="4" fill="none" stroke="#b98cff" stroke-width="3"/><path d="M40 47l5 5-5 5m8 5h10" fill="none" stroke="#b98cff" stroke-width="3" stroke-linecap="round"/><text x="105" y="39" fill="#b98cff" class="m cap">AI · CODING AGENT</text><text x="105" y="67" fill="#f4f7ff" class="m" font-size="23" font-weight="700">OPENCODE</text><text x="105" y="95" fill="#aab6ca" class="m" font-size="14">The open-source coding agent</text><text x="488" y="37" text-anchor="end" fill="#b98cff" class="m cap pulse">ACTIVE</text></g>
  <g transform="translate(625 295)"><path d="M0 0h530v112l-20 20H0z" fill="#131a2a" stroke="#37425d"/><rect x="22" y="21" width="62" height="62" fill="#19223a" stroke="#ff7a8a"/><path d="M37 42h32v27H37zM45 34v8m16-8v8M45 52h4m8 0h4M45 61h16" fill="none" stroke="#ff7a8a" stroke-width="3"/><text x="105" y="39" fill="#ff7a8a" class="m cap">AI · AGENT RUNTIME</text><text x="105" y="67" fill="#f4f7ff" class="m" font-size="23" font-weight="700">ATHENA AI</text><text x="105" y="95" fill="#aab6ca" class="m" font-size="14">Autonomous coding &amp; retrieval agent</text><text x="488" y="37" text-anchor="end" fill="#ff7a8a" class="m cap">OPEN SOURCE</text></g>
</svg>
