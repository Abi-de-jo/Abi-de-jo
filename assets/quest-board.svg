<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Abi's build quest</title><desc id="desc">An animated route shows how Abi moves from an idea through interface, system, testing, and shipping.</desc>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.tiny{font-size:12px;letter-spacing:2px}.node{animation:node 5s ease-in-out infinite}.n2{animation-delay:1s}.n3{animation-delay:2s}.n4{animation-delay:3s}.n5{animation-delay:4s}.dash{stroke-dasharray:12 12;animation:dash 1s linear infinite}.flag{animation:flag 1.2s ease-in-out infinite;transform-origin:1035px 112px}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes node{0%,70%,100%{filter:none}10%,35%{filter:url(#glow)}}@keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#0d111f"/><rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#303950"/>
  <text x="45" y="48" fill="#7df9c2" class="m" font-size="16" font-weight="700" letter-spacing="4">QUEST MAP</text><text x="45" y="77" fill="#f4f7ff" class="m" font-size="24" font-weight="700">FROM FIRST SPARK TO RELEASE</text><text x="1150" y="58" text-anchor="end" fill="#8290a8" class="m tiny">AUTOSAVE ON</text>
  <path d="M90 190C190 120 270 240 380 176S575 112 690 183s205 52 320-41" fill="none" stroke="#29344c" stroke-width="10" stroke-linecap="round"/>
  <path d="M90 190C190 120 270 240 380 176S575 112 690 183s205 52 320-41" fill="none" stroke="#b98cff" stroke-width="3" stroke-linecap="round" class="dash"/>
  <g class="node"><circle cx="90" cy="190" r="22" fill="#12192a" stroke="#7df9c2" stroke-width="4"/><circle cx="90" cy="190" r="7" fill="#7df9c2"/><text x="90" y="235" text-anchor="middle" fill="#f4f7ff" class="m tiny">IDEA</text></g>
  <g class="node n2"><circle cx="315" cy="195" r="22" fill="#12192a" stroke="#b98cff" stroke-width="4"/><path d="M304 187h22v16h-22zM300 207h30" fill="none" stroke="#b98cff" stroke-width="3"/><text x="315" y="240" text-anchor="middle" fill="#f4f7ff" class="m tiny">INTERFACE</text></g>
  <g class="node n3"><circle cx="540" cy="137" r="22" fill="#12192a" stroke="#ffd166" stroke-width="4"/><path d="M530 127h20v8h-20zm0 12h20v8h-20z" fill="none" stroke="#ffd166" stroke-width="3"/><text x="540" y="102" text-anchor="middle" fill="#f4f7ff" class="m tiny">SYSTEMS</text></g>
  <g class="node n4"><circle cx="775" cy="214" r="22" fill="#12192a" stroke="#ff7a8a" stroke-width="4"/><path d="M764 214l7 7 15-17" fill="none" stroke="#ff7a8a" stroke-width="4"/><text x="775" y="259" text-anchor="middle" fill="#f4f7ff" class="m tiny">TEST</text></g>
  <g class="node n5"><circle cx="1010" cy="142" r="25" fill="#12192a" stroke="#7df9c2" stroke-width="4"/><path d="M1000 151v-28h34l-8 9 8 9h-26" fill="none" stroke="#7df9c2" stroke-width="4" class="flag"/><text x="1010" y="99" text-anchor="middle" fill="#f4f7ff" class="m tiny">SHIP</text></g>
  <g><animateMotion dur="8s" repeatCount="indefinite" path="M90 190C190 120 270 240 380 176S575 112 690 183s205 52 320-41"/><rect x="-10" y="-14" width="20" height="20" fill="#f2b98b"/><rect x="-13" y="6" width="26" height="20" fill="#7b61ff"/><rect x="-10" y="26" width="8" height="11" fill="#7df9c2"/><rect x="2" y="26" width="8" height="11" fill="#7df9c2"/></g>
</svg>
